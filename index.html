<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Tracker - Free Trial | ZelVen Labs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0F172A; color: #F8FAFC; min-height: 100vh; padding: 20px; text-align: center; }
    
    /* Timer Header Banner */
    .timer-banner { background: #0284C7; color: #fff; padding: 10px; font-weight: bold; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
    
    /* App Demo Interface */
    .app-container { max-width: 400px; margin: 0 auto; background: #1E293B; padding: 24px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    
    .stats { display: flex; justify-content: space-around; margin: 20px 0; background: #0F172A; padding: 12px; border-radius: 10px; border: 1px solid #334155; }
    .stat-box { font-size: 13px; color: #94A3B8; }
    .stat-box strong { display: block; font-size: 20px; color: #10B981; margin-top: 4px; }

    .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .input-group input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0F172A; color: #fff; font-size: 14px; }
    .btn-add { background: #0284C7; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .meal-list { text-align: left; list-style: none; margin: 16px 0; max-height: 150px; overflow-y: auto; }
    .meal-list li { background: #0F172A; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; display: flex; justify-content: space-between; color: #CBD5E1; }

    .btn-buy { display: inline-block; width: 100%; background: #10B981; color: #0F172A; font-weight: bold; padding: 12px; border-radius: 8px; text-decoration: none; margin-top: 15px; }

    /* Trial Expired Overlay */
    #expired-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); justify-content: center; align-items: center; z-index: 100; }
    .expired-card { background: #1E293B; padding: 30px; border-radius: 16px; border: 1px solid #334155; max-width: 360px; text-align: center; }
  </style>
</head>
<body>

  <!-- Top Banner showing remaining trial time -->
  <div class="timer-banner">
    ⏱️ Free Trial Time Remaining: <span id="timer-display">05:00</span>
  </div>

  <!-- Interactive Calorie Tracker Demo -->
  <div class="app-container" id="app-content">
    <h2>Kcal Log Demo</h2>
    <p style="color:#94A3B8; font-size:13px; margin-top: 4px;">Log your meals below to test the app!</p>

    <div class="stats">
      <div class="stat-box">Total Kcal<strong id="total-kcal">0</strong></div>
      <div class="stat-box">Goal<strong>2,000</strong></div>
    </div>

    <div class="input-group">
      <input type="text" id="meal-name" placeholder="Food item (e.g. Rice)" />
      <input type="number" id="meal-kcal" placeholder="Kcal" style="width: 80px;" />
      <button class="btn-add" onclick="addMeal()">Add</button>
    </div>

    <ul class="meal-list" id="meal-list">
      <!-- Added meals appear here -->
    </ul>

    <a href="sales.html" class="btn-buy">Buy Lifetime Access for ₱29</a>
  </div>

  <!-- Expired Screen Overlay -->
  <div id="expired-overlay">
    <div class="expired-card">
      <h2 style="color:#F8FAFC; margin-bottom:10px;">Trial Period Ended</h2>
      <p style="color:#94A3B8; font-size:14px; margin-bottom:20px;">Your 5-minute free demo has ended. Get unlimited lifetime access to keep tracking your meals offline!</p>
      <a href="sales.html" class="btn-buy">Unlock Lifetime Access (₱29)</a>
    </div>
  </div>

  <script>
    // 1. Calorie Tracker Functions
    let totalKcal = 0;

    function addMeal() {
      const nameInput = document.getElementById('meal-name');
      const kcalInput = document.getElementById('meal-kcal');
      
      const name = nameInput.value.trim();
      const kcal = parseInt(kcalInput.value);

      if (name && !isNaN(kcal) && kcal > 0) {
        totalKcal += kcal;
        document.getElementById('total-kcal').innerText = totalKcal;

        const li = document.createElement('li');
        li.innerHTML = `<span>${name}</span><strong>${kcal} kcal</strong>`;
        document.getElementById('meal-list').appendChild(li);

        nameInput.value = '';
        kcalInput.value = '';
      }
    }

    // 2. 5-Minute Trial Timer with LocalStorage
    const TRIAL_DURATION = 5 * 60; // 5 minutes in seconds
    let startTime = localStorage.getItem('kcal_trial_start');

    if (!startTime) {
      startTime = Date.now();
      localStorage.setItem('kcal_trial_start', startTime);
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const remaining = TRIAL_DURATION - elapsed;

      if (remaining <= 0) {
        document.getElementById('timer-display').innerText = "00:00";
        document.getElementById('expired-overlay').style.display = 'flex';
      } else {
        const mins = Math.floor(remaining / 60).toString().padStart(2, '0');
        const secs = (remaining % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;
        setTimeout(updateTimer, 1000);
      }
    }

    updateTimer();
  </script>
</body>
</html>
