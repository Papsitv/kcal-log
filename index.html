<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Tracker - Free Trial | ZelVen Labs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0F172A; color: #F8FAFC; min-height: 100vh; padding: 20px; text-align: center; }
    
    /* Timer Header Banner */
    .timer-banner { background: #0284C7; color: #fff; padding: 10px; font-weight: bold; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
    
    /* App Demo Interface */
    .app-container { max-width: 400px; margin: 0 auto; background: #1E293B; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .btn-buy { display: inline-block; width: 100%; background: #10B981; color: #0F172A; font-weight: bold; padding: 12px; border-radius: 8px; text-decoration: none; margin-top: 15px; }

    /* Trial Expired Overlay */
    #expired-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); justify-content: center; align-items: center; z-index: 100; }
    .expired-card { background: #1E293B; padding: 30px; border-radius: 16px; border: 1px solid #334155; max-width: 360px; }
  </style>
</head>
<body>

  <!-- Top Banner showing remaining trial time -->
  <div class="timer-banner">
    ⏱️ Free Trial Time Remaining: <span id="timer-display">05:00</span>
  </div>

  <!-- Full Functional App Demo -->
  <div class="app-container" id="app-content">
    <h2>Calorie Tracker Demo</h2>
    <p style="color:#94A3B8; font-size:13px; margin: 10px 0;">Try all logging features below!</p>
    
    <!-- YOUR EXISTING APP FUNCTIONALITY/FORM HERE -->

    <a href="sales.html" class="btn-buy">Buy Lifetime Access for ₱29</a>
  </div>

  <!-- Expired Screen Overlay -->
  <div id="expired-overlay">
    <div class="expired-card">
      <h2 style="color:#F8FAFC; margin-bottom:10px;">Trial Period Ended</h2>
      <p style="color:#94A3B8; font-size:14px; margin-bottom:20px;">Your 5-minute free demo has ended. Get unlimited lifetime access to keep tracking your meals!</p>
      <a href="sales.html" class="btn-buy">Unlock Lifetime Access (₱29)</a>
    </div>
  </div>

  <script>
    // 5 Minute Trial Timer using Local Storage
    const TRIAL_DURATION = 5 * 60; // 5 minutes in seconds
    let startTime = localStorage.getItem('kcal_trial_start');

    if (!startTime) {
      startTime = Date.now();
      localStorage.setItem('kcal_trial_start', startTime);
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const remaining = TRIAL_DURATION - elapsed;

      if (remaining <= 0) {
        document.getElementById('timer-display').innerText = "00:00";
        document.getElementById('expired-overlay').style.display = 'flex';
      } else {
        const mins = Math.floor(remaining / 60).toString().padStart(2, '0');
        const secs = (remaining % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;
        setTimeout(updateTimer, 1000);
      }
    }

    updateTimer();
  </script>
</body>
</html>
