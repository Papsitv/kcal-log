<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>kcal-log Admin</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;margin:20px;background:#0d1117;color:#c9d1d9}
    .card{background:#161b22;padding:16px;border-radius:8px;border:1px solid #30363d;max-width:800px;margin:0 auto}
    input,select,button{width:100%;padding:8px;margin-top:8px;border-radius:6px;border:1px solid #30363d;background:transparent;color:inherit}
    label{font-size:0.9rem;color:#8b949e;margin-top:10px;display:block}
    .row{display:flex;gap:8px}
    .half{flex:1}
    pre{background:#0b1220;padding:12px;border-radius:6px;overflow:auto}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:8px;border-bottom:1px solid #222}
  </style>
</head>
<body>
  <div class="card">
    <h2>kcal-log Admin — Generate One-Time Codes</h2>
    <p style="color:#8b949e">Enter your <strong>ADMIN_TOKEN</strong> (kept only in your browser session) to call protected endpoints.</p>

    <label>ADMIN_TOKEN</label>
    <input id="admin-token" placeholder="Paste your ADMIN_TOKEN here" />

    <label>Buyer name (optional)</label>
    <input id="buyer-name" placeholder="Full name" />

    <div class="row">
      <div class="half">
        <label>Buyer phone (optional)</label>
        <input id="buyer-phone" placeholder="0917..." />
      </div>
      <div class="half">
        <label>Amount</label>
        <input id="amount" value="PHP 29" />
      </div>
    </div>

    <label>Expires in days</label>
    <input id="expires" type="number" value="7" />

    <button id="gen">Generate code</button>
    <div id="generated" style="margin-top:12px"></div>

    <hr style="margin:16px 0;border:none;border-top:1px solid #222" />

    <h3>Existing codes (admin)</h3>
    <button id="refresh">Refresh list</button>
    <div id="codes-list"></div>

    <hr style="margin:16px 0;border:none;border-top:1px solid #222" />
    <h3>Pending buyer requests</h3>
    <div id="requests-list"></div>
  </div>

  <script>
    const el = id => document.getElementById(id);
    el('gen').addEventListener('click', async ()=>{
      const token = el('admin-token').value.trim();
      if(!token){ alert('ADMIN_TOKEN required'); return; }
      const body = { buyerName: el('buyer-name').value||null, buyerPhone: el('buyer-phone').value||null, amount: el('amount').value||null, expiresInDays: parseInt(el('expires').value||7,10) };
      try{
        const res = await fetch('/api/generate', { method:'POST', headers:{ 'Content-Type':'application/json', 'x-admin-token': token }, body: JSON.stringify(body) });
        const data = await res.json();
        if(res.ok){ el('generated').innerHTML = `<pre>CODE: ${data.code}\nID: ${data.id}\nExpires: ${new Date(data.expiresAt).toLocaleString()}</pre>`; }
        else { el('generated').innerHTML = `<pre>ERROR: ${data.error||JSON.stringify(data)}</pre>`; }
      }catch(e){ el('generated').innerHTML = `<pre>Network error\n${e}</pre>` }
    });

    el('refresh').addEventListener('click', async ()=>{
      const token = el('admin-token').value.trim();
      if(!token){ alert('ADMIN_TOKEN required'); return; }
      try{
        const res = await fetch('/api/codes', { headers:{ 'x-admin-token': token } });
        const data = await res.json();
        if(res.ok){
          if(!data.length) el('codes-list').innerHTML = '<p style="color:#8b949e">No codes generated yet.</p>';
          else{
            let html = '<table><tr><th>ID</th><th>Buyer</th><th>Phone</th><th>Amount</th><th>Created</th><th>Expires</th><th>Used</th></tr>';
            for(const c of data){ html += `<tr><td>${c.id}</td><td>${c.buyerName||''}</td><td>${c.buyerPhone||''}</td><td>${c.amount||''}</td><td>${new Date(c.createdAt).toLocaleString()}</td><td>${new Date(c.expiresAt).toLocaleString()}</td><td>${c.used?('Yes at '+new Date(c.usedAt).toLocaleString()):'No'}</td></tr>` }
            html += '</table>';
            el('codes-list').innerHTML = html;
          }
        } else { el('codes-list').innerHTML = `<pre>ERROR: ${JSON.stringify(data)}</pre>` }
      }catch(e){ el('codes-list').innerHTML = `<pre>Network error\n${e}</pre>` }
    });

      async function refreshRequests(){
        try{
          const token = el('admin-token').value.trim();
          if(!token){ el('requests-list').innerHTML = '<p style="color:#8b949e">Enter ADMIN_TOKEN to view requests.</p>'; return; }
          const res = await fetch('/api/codes', { headers: { 'x-admin-token': token } }); // reuse admin endpoint to fetch list and filter pending
          const data = await res.json();
          if(res.ok){
            const pending = data.filter(d => d.status === 'pending');
            if(!pending.length) el('requests-list').innerHTML = '<p style="color:#8b949e">No pending requests.</p>';
            else{
              let html = '<table><tr><th>ID</th><th>Buyer</th><th>Phone</th><th>Amount</th><th>Created</th><th>Action</th></tr>';
              for(const r of pending){ html += `<tr><td>${r.id}</td><td>${r.buyerName||''}</td><td>${r.buyerPhone||''}</td><td>${r.amount||''}</td><td>${new Date(r.createdAt).toLocaleString()}</td><td><button data-id="${r.id}" class="gen-from-request">Generate</button></td></tr>` }
              html += '</table>';
              el('requests-list').innerHTML = html;
              document.querySelectorAll('.gen-from-request').forEach(btn => btn.addEventListener('click', async (ev)=>{
                const id = ev.currentTarget.getAttribute('data-id');
                const token = el('admin-token').value.trim();
                if(!token){ alert('ADMIN_TOKEN required'); return; }
                // find request data
                const req = pending.find(p=>p.id===id);
                const body = { buyerName: req.buyerName, buyerPhone: req.buyerPhone, amount: req.amount };
                const res2 = await fetch('/api/generate', { method:'POST', headers:{ 'Content-Type':'application/json','x-admin-token': token }, body: JSON.stringify({ ...body, expiresInDays:7, requestId: id }) });
                const j2 = await res2.json();
                if(res2.ok){ el('generated').innerHTML = `<pre>CODE: ${j2.code}\nID: ${j2.id}\nExpires: ${new Date(j2.expiresAt).toLocaleString()}</pre>`; refreshRequests(); }
                else el('generated').innerHTML = `<pre>ERROR: ${JSON.stringify(j2)}</pre>`;
              }));
            }
          }
        }catch(e){ el('requests-list').innerHTML = `<pre>Network error\n${e}</pre>` }
      }

      // refresh requests when page loads
      setTimeout(refreshRequests, 600);
  </script>
</body>
</html>
